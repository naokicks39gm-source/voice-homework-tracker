<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>提出状況</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <h2>提出状況</h2>
  <p id="message">読み込み中...</p>

<table id="table">
  <tr>
    <th>番号</th>
    <th>提出済み宿題</th>
    <th>未提出宿題</th>
    <th>提出率</th>
  </tr>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { doc, getDoc, getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

console.log("START");

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "voice-homework-checker.firebaseapp.com",
  projectId: "voice-homework-checker",
  storageBucket: "voice-homework-checker.firebasestorage.app",
  messagingSenderId: "641056865813",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const table = document.getElementById("table");
const message = document.getElementById("message");

if (!table || !message) {
  throw new Error("DOM not found");
}

const params = new URLSearchParams(location.search);

const year = params.get("year") || new Date().getFullYear().toString();
const grade = params.get("grade");
const classNum = params.get("class");

if (!grade || !classNum) {
  message.textContent = "grade / class が不足";
  throw new Error("missing params");
}

const docId = `${year}_${grade}_${classNum}`;

console.log("DOC_ID:", docId);

try {
  const snap = await getDoc(doc(db, "studentShares", docId));

  if (!snap.exists()) {
    message.textContent = "データなし";
    throw new Error("no data");
  }

  const data = snap.data();
  const students = data.students;

  message.textContent = "";

Object.entries(students)
    .sort((a, b) => Number(a[0]) - Number(b[0]))
    .forEach(([id, info]) => {
      // 💡 配列データ（Firestoreのリスト）をカンマ区切りの文字列に変換する処理を追加
      const subList = Object.values(info.submitted || {}).join(", ");
      const misList = Object.values(info.missing || {}).join(", ");
      
      // 提出率が数値の場合は % をつける
      const rateDisplay = typeof info.rate === 'number' ? `${info.rate}%` : (info.rate || "0%");

      table.insertAdjacentHTML("beforeend", `
        <tr>
          <td>${id}番</td>
          <td>${subList || "-"}</td>
          <td>${misList || "-"}</td>
          <td>${rateDisplay}</td>
        </tr>
      `);
    });

  console.log("DONE");

} catch (e) {
  console.error(e);
  message.textContent = "読み込み失敗";
}
</script>

</body>
</html>
