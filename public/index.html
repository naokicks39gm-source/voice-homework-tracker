<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>提出状況</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
<div id="hw-selector">
  <button onclick="window.location.search = '?year=2026&grade=1&class=1&hw=数学'">数学</button>
  <button onclick="window.location.search = '?year=2026&grade=1&class=1&hw=英語'">英語</button>
  <button onclick="window.location.search = '?year=2026&grade=1&class=1&hw=宿題'">宿題</button>
</div>
  <h2>提出状況</h2>
  <p id="message">読み込み中...</p>

<table id="table">
  <tr>
    <th>番号</th>
    <th>提出済み宿題</th>
    <th>未提出宿題</th>
    <th>提出率</th>
  </tr>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { doc, getDoc, getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

console.log("START");

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "voice-homework-checker.firebaseapp.com",
  projectId: "voice-homework-checker",
  storageBucket: "voice-homework-checker.firebasestorage.app",
  messagingSenderId: "641056865813",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const table = document.getElementById("table");
const message = document.getElementById("message");

if (!table || !message) {
  throw new Error("DOM not found");
}

const params = new URLSearchParams(location.search);

const year = params.get("year") || new Date().getFullYear().toString();
const grade = params.get("grade");
const classNum = params.get("class");
const targetHw = params.get("hw"); // 💡 追加：URLから項目名を取得


if (!grade || !classNum) {
  message.textContent = "grade / class が不足";
  throw new Error("missing params");
}

const docId = `${year}_${grade}_${classNum}`;

console.log("DOC_ID:", docId);

try {
  const snap = await getDoc(doc(db, "studentShares", docId));

  if (!snap.exists()) {
    message.textContent = "データなし";
    throw new Error("no data");
  }

// index.html 内のデータ取得部分
const data = snap.data();
  // 構造: data.students["数学"]... のように階層化されている想定
  const category = targetHw || "宿題";
  
  // data.students が存在し、その中に category キーがあればそれを使う
  const students = (data.students && data.students[category]) ? data.students[category] : {};

  if (Object.keys(students).length === 0) {
      message.textContent = `${category} のデータが見つかりません`;
      throw new Error("no category data");
  }

  // 以下、students を使って表を描画
  const infoHeader = document.createElement("h3");
  infoHeader.textContent = `${data.grade}年${data.classNum}組 ${category} 提出状況`;
  message.parentNode.insertBefore(infoHeader, message.nextSibling);
  message.textContent = "";

  Object.entries(students).sort((a, b) => Number(a[0]) - Number(b[0])).forEach(([id, info]) => {
      // 描画ロジック...
      table.insertAdjacentHTML("beforeend", `
        <tr>
          <td>${id}番</td>
          <td>${Object.values(info.submitted || {}).join(", ") || "-"}</td>
          <td>${Object.values(info.missing || {}).join(", ") || "-"}</td>
          <td>${info.submittedCount || 0}/${info.totalHw || 0} (${info.rate || 0}%)</td>
        </tr>
      `);
  });

  console.log("DONE");

} catch (e) {
  console.error(e);
  // message を上書きしないように調整
  if (!message.textContent) message.textContent = "読み込み失敗";
}
</script>

</body>
</html>
