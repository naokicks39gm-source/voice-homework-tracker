<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>提出状況</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <h2>提出状況</h2>
  <p id="message">読み込み中...</p>

<table id="table">
  <tr>
    <th>番号</th>
    <th>提出済み宿題</th>
    <th>未提出宿題</th>
    <th>提出率</th>
  </tr>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { doc, getDoc, getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

console.log("START");

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "voice-homework-checker.firebaseapp.com",
  projectId: "voice-homework-checker",
  storageBucket: "voice-homework-checker.firebasestorage.app",
  messagingSenderId: "641056865813",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const table = document.getElementById("table");
const message = document.getElementById("message");

if (!table || !message) {
  throw new Error("DOM not found");
}

const params = new URLSearchParams(location.search);

const year = params.get("year") || new Date().getFullYear().toString();
const grade = params.get("grade");
const classNum = params.get("class");

if (!grade || !classNum) {
  message.textContent = "grade / class が不足";
  throw new Error("missing params");
}

const docId = `${year}_${grade}_${classNum}`;

console.log("DOC_ID:", docId);

try {
  const snap = await getDoc(doc(db, "studentShares", docId));

  if (!snap.exists()) {
    message.textContent = "データなし";
    throw new Error("no data");
  }

  const data = snap.data();
  const students = data.students;


  // 💡 ここで「〇年〇組」を表示する要素を追加
  const infoHeader = document.createElement("h3");
  infoHeader.textContent = `${data.grade}年${data.classNum}組`;
  message.parentNode.insertBefore(infoHeader, message.nextSibling);

  message.textContent = "";

Object.entries(students)
    .sort((a, b) => Number(a[0]) - Number(b[0]))
 .forEach(([id, info]) => {
      const subList = Object.values(info.submitted || {}).join(", ");
      const misList = Object.values(info.missing || {}).join(", ");
      
      // 💡 提出率の表記を修正：提出数/全提出数 (パーセント%)
      // 提出数は subList が空でなければその数、空なら0
      const subArray = Object.values(info.submitted || {});
      const submittedCount = subArray.length;
      
      // 全提出数は「提出済み数 + 未提出数」で算出
      const misArray = Object.values(info.missing || {});
      const totalHw = submittedCount + misArray.length;
      
      // パーセントの計算
      const percentage = totalHw === 0 ? 0 : Math.round((submittedCount / totalHw) * 100);
      
      const rateDisplay = `${submittedCount}/${totalHw} (${percentage}%)`;

      table.insertAdjacentHTML("beforeend", `
        <tr>
          <td>${id}番</td>
          <td>${subList || "-"}</td>
          <td>${misList || "-"}</td>
          <td>${rateDisplay}</td>
        </tr>
      `);
    });

  console.log("DONE");

} catch (e) {
  console.error(e);
  message.textContent = "読み込み失敗";
}
</script>

</body>
</html>
