<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>提出状況</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
<div id="hw-selector"></div>
  <h2>提出状況</h2>
  <p id="message">読み込み中...</p>

<table id="table">
  <tr>
    <th>番号</th>
    <th>提出済み宿題</th>
    <th>未提出宿題</th>
    <th>提出率</th>
  </tr>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { doc, getDoc, getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "voice-homework-checker.firebaseapp.com",
  projectId: "voice-homework-checker",
  storageBucket: "voice-homework-checker.firebasestorage.app",
  messagingSenderId: "641056865813",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const table = document.getElementById("table");
const message = document.getElementById("message");
const hwSelector = document.getElementById("hw-selector");

const params = new URLSearchParams(location.search);
const year = params.get("year") || new Date().getFullYear().toString();
const grade = params.get("grade");
const classNum = params.get("class");
const targetHw = params.get("hw");

if (!grade || !classNum) {
  message.textContent = "grade / class が不足";
  throw new Error("missing params");
}

const docId = `${year}_${grade}_${classNum}`;

try {
  const snap = await getDoc(doc(db, "studentShares", docId));
  if (!snap.exists()) {
    message.textContent = "データなし";
    throw new Error("no data");
  }

  const data = snap.data();
  console.log("Firestore上の全データ構造:", data); // ★これを確認
  console.log("Firebase から取得した students キー一覧:", Object.keys(data.students));
  
// 1. ボタンの自動生成（修正版：数字を含むものはすべて除外）
  if (data.students) {
    hwSelector.innerHTML = "";
    
    Object.keys(data.students).forEach(categoryName => {
      // 💡 修正: 数字が含まれている場合はボタンにしない
      // /\d/ は「数字がひとつでも含まれるか」という正規表現です
      if (/\d/.test(categoryName)) return; 
      
      const btn = document.createElement("button");
      btn.textContent = categoryName;
      btn.onclick = () => {
        const newParams = new URLSearchParams(location.search);
        newParams.set("hw", categoryName);
        location.search = newParams.toString();
      };
      hwSelector.appendChild(btn);
    });
  }

  // 2. 表示する教科の決定（指定がなければ最初の教科）
  const category = targetHw || Object.keys(data.students || {})[0];
  const students = (data.students && data.students[category]) ? data.students[category] : {};

  if (Object.keys(students).length === 0) {
      message.textContent = `${category} のデータが見つかりません`;
      throw new Error("no category data");
  }

  // 3. 描画
  const infoHeader = document.createElement("h3");
  infoHeader.textContent = `${data.grade || grade}年${data.classNum || classNum}組 ${category} 提出状況`;
  message.parentNode.insertBefore(infoHeader, message.nextSibling);
  message.textContent = "";

  Object.entries(students).sort((a, b) => Number(a[0]) - Number(b[0])).forEach(([id, info]) => {
      table.insertAdjacentHTML("beforeend", `
        <tr>
          <td>${id}番</td>
          <td>${Object.values(info.submitted || {}).join(", ") || "-"}</td>
          <td>${Object.values(info.missing || {}).join(", ") || "-"}</td>
          <td>${info.submittedCount || 0}/${info.totalHw || 0} (${info.rate || 0}%)</td>
        </tr>
      `);
  });

} catch (e) {
  console.error(e);
  if (!message.textContent) message.textContent = "読み込み失敗";
}
</script>

</body>
</html>
